name: Build Hokm-Joker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
              unzip -q hokm-joker-dealing-animation-v9-deal-fix.zip -d /tmp/hokm
              cp -R /tmp/hokm/hokm-joker-v5/. .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build
      - name: Fix WebView asset paths
        run: |
          sed -i 's#src="/assets/#src="./assets/#g; s#href="/assets/#href="./assets/#g' dist/index.html
      - name: Copy web assets into Android shell
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hokm-joker-final-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
